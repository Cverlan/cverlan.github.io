
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hacked By Cverlan</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100vh;
  background: #030303;
  color: white;
  font-family: Consolas, monospace;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    transparent 0px,
    rgba(0,255,0,.035) 2px,
    transparent 4px
  );
}
.terminal {
  position: absolute;
  top: 20px;
  left: 20px;
  color: #00ff77;
  font-size: 13px;
  text-align: left;
  line-height: 1.8;
}
.container {
  padding: 25px;
  z-index: 1;
}
.glitch {
  position: relative;
  font-size: clamp(35px, 7vw, 90px);
  font-weight: 900;
  color: #ff1738;
  letter-spacing: 4px;
  text-shadow: 3px 0 #00ff77, -3px 0 #008cff;
  animation: glitch 0.3s infinite alternate;
}
@keyframes glitch {
  0% { transform: translate(0); }
  25% { transform: translate(2px,-1px); }
  50% { transform: translate(-3px,2px); }
  75% { transform: translate(3px,1px); }
  100% { transform: translate(-1px,-2px); }
}
.flag {
  font-size: 95px;
  margin: 20px 0;
}
h2 {
  font-size: clamp(32px, 6vw, 75px);
  margin: 15px 0;
  color: #00b85a;
  text-shadow: 0 0 25px #008844;
}
.message {
  color: #ddd;
  font-size: 18px;
  line-height: 1.8;
}
.signature {
  margin-top: 50px;
  color: #00ff77;
  letter-spacing: 5px;
}
.cursor {
  animation: blink 1s step-end infinite;
}
@keyframes blink {
  50% { opacity: 0; }
}
</style>
</head>
<body>

<div class="terminal">
  [+] SYSTEM ACCESS: SIMULATION<br>
  [+] OPERATOR: CVERLAN<br>
  [+] MESSAGE: FREE PALESTINE<br>
  [+] STATUS: DISPLAY ACTIVE
</div>

<main class="container">
  <div class="glitch">HACKED BY CVERLAN</div>

  <div class="flag">🇵🇸</div>

  <h2>FREE PALESTINE</h2>

  <div class="message">
    We stand for freedom, justice and humanity.<br>
    Silence is not an option.<br>
    Özgür Filistin!
  </div>

  <div class="signature">
    &gt; CVERLAN <span class="cursor">_</span>
  </div>
</main>

</body>
</html>
